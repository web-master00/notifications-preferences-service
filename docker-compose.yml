services:
  postgres:
    image: postgres:16
    container_name: notification-preferences-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: notification_preferences
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d notification_preferences"]
      interval: 2s
      timeout: 5s
      retries: 15

  app:
    build: .
    container_name: notification-preferences-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://postgres:postgres@postgres:5432/notification_preferences?schema=public"
      PORT: 3000
    ports:
      - "3000:3000"

volumes:
  postgres_data:
